# generated by `theme` -- do not edit by hand
add_newline = true
command_timeout = 800

format = """$directory$git_branch$git_status$cmd_duration
$character"""

[character]
success_symbol = '[\$](bold #e0e0e0)'
error_symbol   = '[\$](bold #ff4444)'

[directory]
style = "bold #e0e0e0"
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold #f0a93b"

[git_status]
style = "bold #8f8f8f"

[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "#8f8f8f"
