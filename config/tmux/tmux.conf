# ~/.config/tmux/tmux.conf
# The L8 layout: agent pane on the left, Neovim on the right, one window
# (tab) per task. Prefix is Ctrl-a, because Ctrl-b fights with everything.

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Truecolor. Without these two lines kitty's colors are wrong inside tmux.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,*256col*:Tc"

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10          # don't lag <Esc> in Neovim
set -g focus-events on

# Splits that keep the current directory, and read like what they do
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# hjkl pane navigation -- the same motion as Hyprland and Neovim
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with HJKL (repeatable: hold the key after the prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys in copy mode; y copies to the Wayland clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# One keystroke for the whole L8 layout: agent left, editor right.
# prefix + D  ("dev")
bind D split-window -h -c "#{pane_current_path}" \; \
       send-keys 'nvim .' C-m \; \
       select-pane -L

# --- Catppuccin Mocha statusline (no plugins) ---
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left  "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#a6adc8]%a %d %b #[fg=#cba6f7,bold]%H:%M "
set -g status-left-length 30
setw -g window-status-current-style "fg=#cba6f7,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #[fg=#a6adc8]#I:#W "
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=#313244,fg=#cdd6f4"
