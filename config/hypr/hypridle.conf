# ~/.config/hypr/hypridle.conf
# Laptop timings. Deliberately NO auto-suspend until resume-from-suspend
# is verified on this machine -- add it back once you've tested a manual
# `systemctl suspend` and confirmed the lid/wake cycle works.

general {
    lock_cmd         = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

# 5 min: dim the backlight (saves battery, easy to notice and cancel)
listener {
    timeout   = 300
    on-timeout = brightnessctl -s set 10
    on-resume  = brightnessctl -r
}

# 10 min: lock
listener {
    timeout    = 600
    on-timeout = loginctl lock-session
}

# 15 min: screen off
listener {
    timeout    = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
