# generated by `theme` -- do not edit by hand
# Layout from the shipped sample at /usr/share/hypr/hyprlock.conf.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/januario/Pictures/unit-os-theme/anima-wheel.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.55
}

input-field {
    monitor =
    size = 18%, 5%
    outline_thickness = 2
    rounding = 0

    inner_color = rgba(000000ff)
    outer_color = rgba(e0e0e0ff)
    check_color = rgba(f0a93bff)
    fail_color  = rgba(ff4444ff)

    font_color        = rgba(e0e0e0ff)
    placeholder_color = rgba(8f8f8fb3)
    font_family       = $font

    placeholder_text = Password
    fail_text        = $PAMFAIL
    fade_on_empty    = false
    dots_spacing     = 0.3

    position = 0, -40
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 92
    font_family = $font
    color = rgba(e0e0e0ff)

    position = 0, 180
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 18
    font_family = $font
    color = rgba(e0e0e0ff)

    position = 0, 110
    halign = center
    valign = center
}
