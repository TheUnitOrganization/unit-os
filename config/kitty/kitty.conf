# ~/.config/kitty/kitty.conf  -- Catppuccin Mocha

font_family      Geist Mono
# Nerd Font icons (waybar-style glyphs, prompt symbols) still come from
# JetBrainsMono Nerd Font via symbol fallback.
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF,U+2500-U+259F JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        13.0

# Scrollback / behaviour
scrollback_lines            10000
enable_audio_bell           no
# -1, not 0. 0 disables the close prompt entirely, which was fine when
# closing a tab meant Ctrl+Shift+W -- nobody hits that by accident. Ctrl+W is
# one slip away from Ctrl+E/Q/R, and closing a tab SIGHUPs whatever is in it.
# Negative means "only count windows where a command is actually running", so
# a tab sitting at a bash prompt still closes instantly with no nag, while a
# tab running an agent asks first and names the program it would kill.
confirm_os_window_close     -1
window_padding_width        14
cursor_trail                0

# Wayland: let Hyprland draw no titlebar
hide_window_decorations     yes
wayland_titlebar_color      background

# Palette + opacity are generated by `theme`
include colors.conf

# Keys
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+plus    change_font_size all +1.0
map ctrl+minus   change_font_size all -1.0
map ctrl+0       change_font_size all 0

# Shift+Enter -> newline instead of submit (Claude Code, and most REPLs).
# \x1b\r is ESC + CR, which is what Alt+Enter sends; Claude Code reads it
# as "insert a newline".

# Selecting with the mouse copies straight to the clipboard (kitty only
# does primary-selection by default, which is why nothing pasted).
copy_on_select clipboard

# Right-click pastes, middle-click pastes the primary selection.
mouse_map right press ungrabbed paste_from_clipboard
mouse_map middle release ungrabbed paste_from_selection
strip_trailing_spaces smart

# Paste, every way you might reach for it.
map ctrl+shift+v paste_from_clipboard
map shift+insert paste_from_clipboard
# Ctrl+V pastes too. This takes Ctrl+V away from apps inside the terminal:
# in bash it was 'insert next char literally' (rarely used), in vim it was
# visual-block mode -- which is remapped to Ctrl+Q in ~/.config/nvim/init.lua.
# Through smart_paste.py rather than paste_from_clipboard: text pastes as
# usual, but an image-only clipboard (a SUPER+SHIFT+S snip) forwards the
# real Ctrl+V to the program instead, so Claude Code can take the image.
map ctrl+v kitten smart_paste.py
map ctrl+shift+s paste_from_selection

map shift+enter send_text all \x1b\r
map ctrl+enter  send_text all \x1b\r

# ---- Agent tabs -------------------------------------------------------
# Remote control is what lets SUPER+A add a tab to the kitty you are
# already looking at, instead of opening yet another window. Each instance
# listens on unix:@mykitty-<pid>; ~/.local/bin/agent finds the right pid
# from `hyprctl activewindow`.
allow_remote_control  yes
listen_on             unix:@mykitty

# Tabs as pills, to match the waybar capsules. The bar only appears once a
# second tab exists, so a single terminal stays clean.
tab_bar_edge          top
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_margin_height 6.0 2.0
tab_title_template    "{index}  {title}"
active_tab_font_style bold

# Jump straight to an agent. Alt+N is free inside Claude Code and nvim,
# which is why it beats kitty's default ctrl+shift+N.
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9
# Ctrl+N is the browser reflex for the same jump. Safe to take: Ctrl+digit
# carries no useful terminal meaning, unlike Ctrl+T and Ctrl+W (see below).
# Ctrl+0 stays font-reset, which is what a browser does with it too.
map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9
# Ctrl+arrow steps through tabs. Same trade as Ctrl+W above: Ctrl+arrow was
# backward-word/forward-word at the prompt, so that function moves to
# Alt+arrow, which sends the very sequence Ctrl+arrow used to (\e[1;5D/C).
# Every app that understood Ctrl+arrow word-jump still gets it, one key over.
# Alt+1..9 still jumps to a tab, so nothing about tabs is lost either.
map ctrl+left  previous_tab
map ctrl+right next_tab
# The same step on the literal < and > keys.
map ctrl+shift+comma  previous_tab
map ctrl+shift+period next_tab
map alt+left   send_text all \x1b[1;5D
map alt+right  send_text all \x1b[1;5C
# New tab in the same directory, and close-tab, without leaving the keyboard.
map ctrl+shift+t new_tab_with_cwd
# Ctrl+T is new-tab, browser-style. It was fzf-file-widget (~/.bashrc), so
# the same move as everywhere else here: Alt+T sends the raw ^T byte (0x14)
# and fzf still answers, one key over. Costs readline's transpose-words on
# Alt+T, which is not a key anyone reaches for.
map ctrl+t new_tab_with_cwd
map alt+t  send_text all \x14
map ctrl+shift+w close_tab

# Ctrl+W closes the tab, browser-style. That key was unix-word-rubout at
# every prompt (and nvim's window prefix), so it is not dropped -- it is
# MOVED. kitty eats ctrl+w before the app sees it, then ctrl+backspace
# sends the raw ^W byte (0x17) onward, so bash, Claude Code and nvim all
# still get exactly the erase-previous-word they had, on the key Windows
# and every browser already use for it.
# Kept deliberately as ^W and not backward-kill-word: ^W breaks on
# whitespace only, so it eats a whole /path/like/this in one press, which
# is the behaviour that was there before.
map ctrl+w         close_tab
map ctrl+backspace send_text all \x17
